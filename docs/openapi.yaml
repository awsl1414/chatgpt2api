            application/json:
              schema:
                type: object
                required: [server, servers]
                properties:
                  server: { $ref: "#/components/schemas/Sub2APIServer" }
                  servers:
                    type: array
                    items: { $ref: "#/components/schemas/Sub2APIServer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

