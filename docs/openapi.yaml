# chatgpt2api 对外接口 OpenAPI 3.1 规范
#
# 生成依据：chatgpt2api 仓库 v1.8.0 源码静态分析（static）。
# 2026-11-01 复核：与 `create_app().openapi()` 运行时导出逐操作比对，并用
# TestClient 采样各端点真实响应体；路由集合、请求模型与错误形态均以实测为准。
# 响应中仍标注「未逐项核实」的字段表示只有静态读取依据。
openapi: 3.1.0
info:
  title: chatgpt2api API
  version: 1.8.0
  description: |
    ChatGPT 逆向代理（chatgpt2api）的对外 HTTP 接口。

    接口分四层，鉴权强度不同：

    1. **OpenAI 兼容 API**（`/v1/*`，另含 Anthropic 兼容的 `/v1/messages`）——面向下游客户端，
       admin / user 密钥均可调用；`stream=true` 时返回 `text/event-stream`。
    2. **图片异步任务 API**（`/api/image-tasks/*`）——非 OpenAI 标准的扩展，提交后轮询。
    3. **管理面板 API**（`/api/*` 其余部分）——仅 admin 密钥可用，为内置 Web 面板（Next.js）服务。
    4. **无鉴权端点**——`/version`、`/health`、图片/文件直链与前端静态资源。

    鉴权：`Authorization: Bearer <key>`；`/v1/messages` 额外接受 `x-api-key`。
    `config.json` 中的 `auth-key` 等价于一个 admin 身份。

    > 免责声明：本项目为对 chatgpt.com 的逆向研究产物，仅供学习研究。
servers:
  - url: http://localhost:3000
    description: Docker 默认映射（3000:80）

tags:
  - name: OpenAI 兼容 API
  - name: Anthropic 兼容 API
  - name: 图片异步任务
  - name: 可编辑文件任务
  - name: 身份
  - name: 密钥管理
  - name: 号池管理
  - name: 外部账号源
  - name: 系统设置
  - name: 图片管理
  - name: 备份
  - name: 公开端点

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ #
  # OpenAI 兼容 API
  # ------------------------------------------------------------------ #
  /v1/models:
    get:
      tags: [OpenAI 兼容 API]
      summary: 列出模型
      description: |
        返回按号池内账号类型从上游拉取的模型目录，并动态追加生图模型：
        有 web 生图账号追加 `gpt-image-2`；有 codex Plus/Team/Pro 账号追加
        `codex-gpt-image-2`、`codex-gpt-image-2.5-flare`、`codex-gpt-image-2.5-sunburst`
        及 `plus-`/`team-`/`pro-` 前缀变体（`utils/helper.py:CODEX_IMAGE_PUBLIC_MODELS`）。
        （static：services/protocol/openai_v1_models.py；capture：2026-11-01 实测返回 chatgpt 域模型目录）
      responses:
        "200":
          description: 模型列表（OpenAI Model 格式）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: 上游目录拉取失败
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/chat/completions:
    post:
      tags: [OpenAI 兼容 API]
      summary: 文本生成（OpenAI Chat 格式）
      description: |
        支持同步 JSON 与 `stream=true` SSE（OpenAI chunk 格式）。
        请求体 schema 宽松（服务端 `extra="allow"`，未识别字段被透传）。
        调用前会先执行内容审核，REJECT 则拒绝。
        （static：api/ai.py、services/protocol/openai_v1_chat_complete.py）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: |
            同步返回 Chat Completion；`stream=true` 时返回 SSE 流
            （`data: {...}` 行 + 终止行 `data: [DONE]`，OpenAI 格式）。
            图片模型分支的 `message.content` 是 Markdown 图片
            （`![image_1](data:image/png;base64,...)`），不是纯文本。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletionResponse" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/responses:
    post:
      tags: [OpenAI 兼容 API]
      summary: 文本生成（OpenAI Responses 格式）
      description: |
        OpenAI Responses 协议面；`stream=true` 时 SSE 为 Responses 事件格式。
        （static：api/ai.py、services/protocol/openai_v1_response.py）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsesCreateRequest" }
      responses:
        "200":
          description: Response 对象或 SSE 流
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: OpenAI Response 对象（字段由上游协议转换而来，未逐项核实）
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/images/generations:
    post:
      tags: [OpenAI 兼容 API]
      summary: 文生图
      description: |
        同步返回或 `stream=true` SSE。
        `response_format=b64_json`（默认）时同时落盘并返回本地 `url`；
        `url` 时仅返回本地 `url`。均附带 `revised_prompt` 与 `usage`。
        `revised_prompt` 是该链路实际发往上游的文本（picture_v2 含 global system
        与尺寸/质量提示；codex 为上游 `input` 原文，global 走 `instructions`）。

        **SSE chunk 不是 OpenAI chunk 结构**，而是自定义对象：事件体为
        `data: {"object": "image.generation.chunk"|"image.generation.message"|"image.generation.result", ...}`。
        共同字段：`object`、`created`、`model`、`index`、`total`、`data`；
        `progress` 阶段额外带 `progress_text` / `upstream_event_type`，
        `message` 阶段带 `message`，`result` 阶段带 `data[]`（元素同同步响应）。
        详见 `ImageGenerationChunk`。
        （static：api/ai.py、services/protocol/openai_v1_image_generations.py、
        services/protocol/image_stream.py:172-202）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageGenerationRequest" }
      responses:
        "200":
          description: 生图结果（含 usage）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageGenerationResponse" }
            text/event-stream:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ImageGenerationChunk"
                description: 每个 `data:` 行一个 image.generation.* 对象
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: 号池无可用生图额度（no available image quota）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/images/edits:
    post:
      tags: [OpenAI 兼容 API]
      summary: 图生图 / 图片编辑
      description: |
        同时支持 multipart/form-data 上传与 application/json（图片用 URL / data URL /
        base64 引用）。`file_id` 引用明确不支持（400）。图片引用单张上限 50MB。
        `config.allow_remote_image_fetch=false` 时，除 data URL / base64 / 上传文件外的
        远程 http(s) 图片引用一律返回 400（SSRF 收敛），对话类图片输入同样受该开关约束。
        响应与 SSE chunk 形态同 `POST /v1/images/generations`（`image.generation.*` 对象）。
        （static：api/image_inputs.py、services/protocol/openai_v1_image_edit.py）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/ImageEditFormRequest"
                - type: object
                  properties:
                    image:
                      type: array
                      items: { type: string, format: binary }
                      description: 输入图片，字段名兼容 image / image[] / images / images[] / image_url / image_url[]
                    mask:
                      type: array
                      items: { type: string, format: binary }
                      description: 蒙版图，字段名兼容 mask / mask[]
          application/json:
            schema: { $ref: "#/components/schemas/ImageEditJsonRequest" }
      responses:
        "200":
          description: 生图结果（含 usage）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageGenerationResponse" }
            text/event-stream:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ImageGenerationChunk"
                description: 每个 `data:` 行一个 image.generation.* 对象
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: 号池无可用生图额度
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/search:
    post:
      tags: [OpenAI 兼容 API]
      summary: 联网搜索
      description: |
        走上游搜索模型（SEARCH_MODEL），响应为上游原始结果外加 `_account_email`
        字段（所用账号邮箱）。（static：services/protocol/openai_search.py）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1 }
      responses:
        "200":
          description: 搜索结果（结构取决于上游搜索模型，未逐项核实）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  _account_email: { type: string, description: 本次调用使用的账号邮箱 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/editable-file-tasks:
    get:
      tags: [可编辑文件任务]
      summary: 查询可编辑文件任务（PPT/PSD）
      parameters:
        - name: ids
          in: query
          required: false
          schema: { type: string }
          description: 逗号分隔的任务 id；为空则返回本身份全部任务
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditableFileTaskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/ppt/generations:
    post:
      tags: [可编辑文件任务]
      summary: 提交 PPT 生成任务
      description: 异步任务：提交后用 /v1/editable-file-tasks 轮询，产物经 /files/{file_path} 下载。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditableFileTaskRequest" }
      responses:
        "200":
          description: 任务快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditableFileTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/psd/generations:
    post:
      tags: [可编辑文件任务]
      summary: 提交 PSD 生成任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditableFileTaskRequest" }
      responses:
        "200":
          description: 任务快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditableFileTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/messages:
    post:
      tags: [Anthropic 兼容 API]
      summary: 文本生成（Anthropic Messages 格式）
      description: |
        Anthropic Messages 协议面。认证可使用 `Authorization: Bearer` 或
        `x-api-key` header（服务端内部拼成 Bearer 处理）。`stream=true` 时
        SSE 为 Anthropic 事件格式（message_start / content_block_delta 等）。

        **仅支持文本对话**：`model` 为受支持的图片模型（`gpt-image-2`、
        `codex-gpt-image-*` 及其 plus-/team-/pro- 前缀变体）时直接返回 400
        （Anthropic 错误体，`error.type=invalid_request_error`），并在消息里
        指明改用 `/v1/images/generations`、`/v1/images/edits`。
        （static：api/ai.py、services/protocol/anthropic_v1_messages.py）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnthropicMessageRequest" }
      parameters:
        - name: x-api-key
          in: header
          required: false
          schema: { type: string }
          description: "Anthropic 风格的密钥，等价于 Authorization: Bearer"
        - name: anthropic-version
          in: header
          required: false
          schema: { type: string }
          description: 仅为兼容透传字段，服务端未校验
      responses:
        "200":
          description: Message 对象或 Anthropic 格式 SSE 流
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Anthropic Message 对象（字段由上游协议转换而来，未逐项核实）
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  # ------------------------------------------------------------------ #
  # 图片异步任务
  # ------------------------------------------------------------------ #
  /api/image-tasks:
    get:
      tags: [图片异步任务]
      summary: 查询图片任务
      description: "任务按「身份 id : client_task_id」隔离，只能看到自己提交的任务。"
      parameters:
        - name: ids
          in: query
          required: false
          schema: { type: string }
          description: 逗号分隔的任务 id；为空则返回本身份全部任务（按 updated_at 倒序）
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageTaskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/image-tasks/generations:
    post:
      tags: [图片异步任务]
      summary: 提交文生图任务
      description: |
        `client_task_id` 幂等：重复提交同一 id 直接返回已存在任务快照。
        任务固定 `n=1`、`response_format=url`。
        （static：services/image_task_service.py:123-169,171-195）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageTaskGenerationRequest" }
      responses:
        "200":
          description: 任务快照（状态为 queued）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/image-tasks/edits:
    post:
      tags: [图片异步任务]
      summary: 提交图生图任务
      description: |
        载体与 /v1/images/edits 相同（multipart 或 JSON），但必须携带 `client_task_id`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/ImageTaskGenerationRequest"
                - type: object
                  required: [client_task_id]
                  properties:
                    client_task_id: { type: string, minLength: 1 }
                    image:
                      type: array
                      items: { type: string, format: binary }
                      description: 字段名兼容 image / image[] / images / images[] / image_url / image_url[]
                    mask:
                      type: array
                      items: { type: string, format: binary }
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ImageEditJsonRequest"
                - type: object
                  required: [client_task_id]
                  properties:
                    client_task_id: { type: string, minLength: 1 }
      responses:
        "200":
          description: 任务快照（状态为 queued）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/image-tasks/{task_id}/resume-poll:
    post:
      tags: [图片异步任务]
      summary: 续期任务轮询
      description: 给未终结任务（queued/running）追加轮询超时，避免客户端侧提前判失败。
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResumePollRequest" }
      responses:
        "200":
          description: 任务快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /files/{file_path}:
    get:
      tags: [可编辑文件任务]
      summary: 下载可编辑文件产物
      description: 无鉴权（依赖路径不可猜测性）。
      security: []
      parameters:
        - name: file_path
          in: path
          required: true
          schema: { type: string }
          description: 相对产物目录的路径，可含子目录
      responses:
        "200":
          description: "文件内容（Content-Disposition: attachment）"
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: 文件不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ------------------------------------------------------------------ #
  # 身份 / 公开端点
  # ------------------------------------------------------------------ #
  /auth/login:
    post:
      tags: [身份]
      summary: 登录（校验密钥并回显身份）
      description: 无签发动作——key 即凭证本身；响应仅回显 role / id / name 与版本。
      responses:
        "200":
          description: 当前身份
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /version:
    get:
      tags: [公开端点]
      summary: 服务版本
      security: []
      responses:
        "200":
          description: 版本号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }

  /health:
    get:
      tags: [公开端点]
      summary: 号池健康监控
      description: 无鉴权。JSON 模式会暴露号池规模、额度、限流与代理状态。
      security: []
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, default: html, enum: [html, json] }
          description: 只有 `json` 走 JSON 分支；其余任意值（含未知值）一律返回 HTML，不报 422。
      responses:
        "200":
          description: html 返回自刷新监控页（30s）；json 返回统计结构
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/HealthStats" }

  # ------------------------------------------------------------------ #
  # 密钥管理（admin）
  # ------------------------------------------------------------------ #
  /api/auth/users:
    get:
      tags: [密钥管理]
      summary: 列出 user 密钥
      responses:
        "200":
          description: 密钥列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [密钥管理]
      summary: 创建 user 密钥
      description: 明文 raw key 仅在创建响应中出现一次（存储的是 SHA-256 哈希）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, default: "" }
      responses:
        "200":
          description: 新密钥（含一次性 raw key）与最新列表
          content:
            application/json:
              schema:
                type: object
                required: [item, key, items]
                properties:
                  item: { $ref: "#/components/schemas/UserKey" }
                  key: { type: string, description: 明文密钥，仅此一次 }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/users/{key_id}:
    post:
      tags: [密钥管理]
      summary: 修改 user 密钥（改名 / 启停 / 换 key）
      parameters:
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, "null"] }
                enabled: { type: [boolean, "null"] }
                key: { type: [string, "null"], description: 替换为新明文密钥 }
      responses:
        "200":
          description: 更新后的密钥与列表
          content:
            application/json:
              schema:
                type: object
                required: [item, items]
                properties:
                  item: { $ref: "#/components/schemas/UserKey" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [密钥管理]
      summary: 删除 user 密钥
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: 删除后的列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------ #
  # 号池管理（admin）
  # ------------------------------------------------------------------ #
  /api/accounts:
    get:
      tags: [号池管理]
      summary: 列出账号
      responses:
        "200":
          description: 账号列表（含 token 摘要、额度、状态、代理等，字段由 account_service 决定，未逐项核实）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [号池管理]
      summary: 批量导入账号
      description: |
        `tokens[]`（纯 access_token）或 `accounts[]`（含 access_token/accessToken 的完整
        对象）至少提供其一；导入后立即执行一轮 refresh 并返回结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tokens:
                  type: array
                  items: { type: string }
                accounts:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      access_token: { type: string, description: 或 accessToken }
      responses:
        "200":
          description: 导入与刷新结果
          content:
            application/json:
              schema:
                type: object
                required: [added, skipped, refreshed, errors, items]
                properties:
                  added: { type: [integer, "null"], description: 新增账号数 }
                  skipped: { type: [integer, "null"], description: 已存在而跳过的账号数 }
                  refreshed: { type: [integer, "null"], description: 刷新成功数 }
                  errors:
                    type: array
                    items: {}
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [号池管理]
      summary: 删除账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tokens]
              properties:
                tokens:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounts/refresh:
    post:
      tags: [号池管理]
      summary: 异步刷新账号 token
      description: 后台执行，返回 progress_id 用于轮询。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_tokens:
                  type: array
                  items: { type: string }
                  description: 为空则刷新全部账号
      responses:
        "200":
          description: 进度 id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounts/refresh/progress/{progress_id}:
    get:
      tags: [号池管理]
      summary: 查询刷新进度
      parameters:
        - $ref: "#/components/parameters/ProgressId"
      responses:
        "200":
          description: 进度结构（字段由 account_service 决定，未逐项核实）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/accounts/re-login:
    post:
      tags: [号池管理]
      summary: 异步密码重登
      description: 流程：密码登录 → 验证码登录 → 刷新 token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_tokens]
              properties:
                access_tokens:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 进度 id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounts/re-login/progress/{progress_id}:
    get:
      tags: [号池管理]
      summary: 查询重登进度
      parameters:
        - $ref: "#/components/parameters/ProgressId"
      responses:
        "200":
          description: 进度结构（未逐项核实）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/accounts/update:
    post:
      tags: [号池管理]
      summary: 修改单个账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token: { type: string }
                type: { type: [string, "null"] }
                status: { type: [string, "null"] }
                quota: { type: [integer, "null"] }
                proxy: { type: [string, "null"] }
      responses:
        "200":
          description: 更新后的账号与列表
          content:
            application/json:
              schema:
                type: object
                required: [item, items]
                properties:
                  item: { $ref: "#/components/schemas/Account" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/accounts/export:
    post:
      tags: [号池管理]
      summary: 导出完整账号
      description: 仅导出同时具备 access_token、refresh_token、id_token 的账号；返回文件下载。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_tokens:
                  type: array
                  items: { type: string }
                format:
                  type: string
                  enum: [json, zip]
                  default: json
      responses:
        "200":
          description: json 返回账号 JSON；zip 返回按账号命名的 zip 包
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounts/oauth/start:
    post:
      tags: [号池管理]
      summary: 发起 OAuth（PKCE）登录
      description: 登记一次 PKCE 会话，返回可让用户浏览器打开的 authorize URL。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_hint: { type: string, default: "", description: 仅用于让登录页预填邮箱 }
      responses:
        "200":
          description: 会话 id 与 authorize URL
          content:
            application/json:
              schema:
                type: object
                required: [session_id, authorize_url]
                properties:
                  session_id: { type: string }
                  authorize_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounts/oauth/finish:
    post:
      tags: [号池管理]
      summary: 完成 OAuth 登录
      description: 提交用户浏览器抓回的 callback（完整 URL 或纯 code），换出 token 三件套并入库、刷新。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string, default: "" }
                callback: { type: string, default: "" }
      responses:
        "200":
          description: 入库与刷新结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  added: { type: [integer, "null"], description: 新增账号数 }
                  skipped: { type: [integer, "null"], description: 已存在而跳过的账号数 }
                  refreshed: { type: [integer, "null"], description: 刷新成功数 }
                  errors: { type: array, items: {} }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------------------ #
