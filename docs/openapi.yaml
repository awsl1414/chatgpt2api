  # ------------------------------------------------------------------ #
  # 系统设置（admin）
  # ------------------------------------------------------------------ #
  /api/settings:
    get:
      tags: [系统设置]
      summary: 读取全局配置
      responses:
        "200":
          description: |
            当前配置。键集合由 `services/config.py:ALLOWED_CONFIG_KEYS` 决定
            （refresh_account_interval_minute、image_* 系列、allow_remote_image_fetch、
            log_levels、sensitive_words、ai_review、global_system_prompt、
            default_upstream_model_name、default_thinking_effort、base_url、backup、
            image_storage、chat_completion_cache、proxy_runtime、third_party_apps）。
            旧版全局 `proxy` 键已移除，不再出现（capture：2026-11-01 实测键集合 30 项）。
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [系统设置]
      summary: 更新全局配置
      description: |
        请求体 schema 宽松（`extra="allow"`），服务端按键值合并更新。
        顶层键经白名单 `ALLOWED_CONFIG_KEYS` 校验：出现未知键返回 400，
        错误体 `{"detail": {"error": "未知配置键: xxx"}}`（capture：2026-11-01 实测）。
        白名单不含 `auth-key`（部署侧配置）与 `backup_state`（独立状态文件）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: 更新后的配置
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
