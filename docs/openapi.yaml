      summary: 列出 Sub2API 服务器
      description: 返回前剔除 password / api_key，仅保留 has_api_key 布尔位。
      responses:
        "200":
          description: 服务器列表
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items: { $ref: "#/components/schemas/Sub2APIServer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
