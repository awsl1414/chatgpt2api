                name: { type: string, default: "" }
                base_url: { type: string }
                email: { type: string, default: "" }
                password: { type: string, default: "" }
                api_key: { type: string, default: "" }
                group_id: { type: string, default: "" }
      responses:
        "200":
          description: 新服务器与列表
