      parameters:
        - $ref: "#/components/parameters/PoolId"
      responses:
        "200":
          description: 远端文件列表（结构由 list_remote_files 决定，未逐项核实）
          content:
            application/json:
              schema:
                type: object
                required: [pool_id, files]
                properties:
                  pool_id: { type: string }
                  files: { type: array, items: { type: object, additionalProperties: true } }
