components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: admin / user 密钥；config.json 的 auth-key 等价于 admin。

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
    KeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string }
    ProgressId:
      name: progress_id
      in: path
      required: true
      schema: { type: string }
    PoolId:
      name: pool_id
      in: path
      required: true
      schema: { type: string }
    ServerId:
      name: server_id
      in: path
      required: true
      schema: { type: string }
    ImageDownloadPath:
      name: image_path
      in: path
      required: true
      schema: { type: string }
      description: 相对图片目录的路径，可含子目录

  responses:
    BadRequest:
      description: |
        参数错误。错误体随路径族不同（capture：2026-11-01 实测）：
        `/v1/*` 返回 OpenAI/Anthropic 兼容错误对象（`/v1/messages` 为 Anthropic 形态），
        其余路径返回 `{"detail": ...}`，其中 detail 可能是字符串，也可能是 `{"error": "..."}`。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: |
        密钥无效或已失效（401）。`/v1/*` 为 OpenAI/Anthropic 兼容错误对象，
        其余路径为 `{"detail": {"error": "密钥无效或已失效，请重新登录"}}`。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: |
        需要管理员权限（403）。`/v1/*` 为 OpenAI/Anthropic 兼容错误对象，
        其余路径为 `{"detail": {"error": "需要管理员权限才能执行这个操作"}}`。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: |
        资源不存在（404）。`/v1/*` 为 OpenAI/Anthropic 兼容错误对象，
        其余路径为 `{"detail": ...}`（字符串或 `{"error": "..."}`）。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    BadGateway:
      description: |
        上游调用失败（502）。`/v1/*` 为 OpenAI/Anthropic 兼容错误对象，
        其余路径为 `{"detail": ...}`。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ValidationError:
      description: |
        请求体校验失败（422，由 FastAPI 直接返回）。`/v1/*` 会被转换成
        `{"error": {"message": "prompt: Field required", "type": "invalid_request_error", ...}}`；
        其余路径保留 FastAPI 原始结构 `{"detail": [{"type", "loc", "msg", "input"}]}`。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    Error:
      description: |
        错误体统一入口（两种路径族两种形态，二选一）：
        - OpenAI 兼容形态（`/v1/*`）：`{"error": {"message", "type", "param", "code"}}`；
          `/v1/messages` 为 Anthropic 形态 `{"type": "error", "error": {"type", "message"}}`。
        - 管理端形态（非 `/v1/*`）：`{"detail": ...}`，detail 为字符串或 `{"error": "..."}`；
          422 校验失败时 detail 为 FastAPI 的错误数组。
      oneOf:
        - $ref: "#/components/schemas/OpenAIErrorBody"
        - $ref: "#/components/schemas/AnthropicErrorBody"
        - $ref: "#/components/schemas/DetailErrorBody"

    ErrorBody:
      description: 与 `Error` 同义，保留旧引用名以免破坏既有引用。
      oneOf:
        - $ref: "#/components/schemas/OpenAIErrorBody"
        - $ref: "#/components/schemas/AnthropicErrorBody"
        - $ref: "#/components/schemas/DetailErrorBody"

    OpenAIErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, param, code]
          properties:
            message: { type: string }
            type:
              type: string
              description: 如 invalid_request_error / authentication_error / permission_error / rate_limit_error / insufficient_quota / server_error
            param: {}
            code:
              type: string
              description: 如 bad_request / invalid_api_key / permission_denied / insufficient_quota / upstream_error

    AnthropicErrorBody:
      type: object
      required: [type, error]
      properties:
        type: { type: string, const: error }
        error:
          type: object
          required: [type, message]
          properties:
            type: { type: string }
            message: { type: string }

    DetailErrorBody:
      type: object
      required: [detail]
      properties:
        detail:
          description: '字符串、`{"error": "..."}` 对象，或 FastAPI 422 的错误数组'
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items: { type: object, additionalProperties: true }

    LoginResponse:
      type: object
      required: [ok, version, role, subject_id, name]
      properties:
        ok: { type: boolean, const: true }
        version: { type: string }
        role: { type: string, enum: [admin, user] }
        subject_id: { type: string }
        name: { type: string }

    VersionResponse:
      type: object
      required: [version]
      properties:
        version: { type: string }

    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id: { type: string }
        object: { type: string, const: model }
        created: { type: integer }
        owned_by: { type: string, description: 上游拉取的模型为 chatgpt 域；动态注入的生图模型为 chatgpt2api }
        permission: { type: array, items: {} }
        root: { type: [string, "null"] }
        parent: { type: [string, "null"] }

    ModelList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Model" }

    ChatCompletionRequest:
      type: object
      additionalProperties: true
      description: OpenAI Chat Completion 请求；未列出的字段原样透传给协议转换层。
      properties:
        model: { type: [string, "null"], default: auto }
        messages:
          type: [array, "null"]
          items: { type: object, additionalProperties: true }
        prompt: { type: [string, "null"] }
        n: { type: [integer, "null"] }
        stream: { type: [boolean, "null"] }
        modalities: { type: [array, "null"], items: { type: string } }

    ChatCompletionResponse:
      type: object
      additionalProperties: true
      description: OpenAI Chat Completion 响应（字段由上游协议转换而来，未逐项核实）。

    ResponsesCreateRequest:
      type: object
      additionalProperties: true
      properties:
        model: { type: [string, "null"], default: auto }
        input: {}
        tools:
          type: [array, "null"]
          items: { type: object, additionalProperties: true }
        tool_choice: {}
        stream: { type: [boolean, "null"] }

    AnthropicMessageRequest:
      type: object
      additionalProperties: true
      properties:
        model: { type: [string, "null"], default: auto }
        messages:
          type: [array, "null"]
          items: { type: object, additionalProperties: true }
        system: {}
        stream: { type: [boolean, "null"] }

    ImageGenerationRequest:
      type: object
      required: [prompt]
      description: |
        `/v1/images/generations` 的 JSON 请求体。`stream` 为 JSON 布尔值；
        multipart 载体（`/v1/images/edits`）使用字符串枚举，见 `ImageEditFormRequest`。
      properties:
        prompt: { type: string, minLength: 1 }
        model: { type: string, default: gpt-image-2 }
        n: { type: integer, minimum: 1, maximum: 4, default: 1 }
        size:
          type: [string, "null"]
          description: |
            `宽x高`（如 `1024x1536`）。**`gpt-image-2`（picture_v2）的接口 size 生效**，
            服务端转成提示词里的尺寸文本，宽高比精确跟随。
            `codex-gpt-image-*` 系列（含 plus-/team-/pro- 前缀）的上游 `tools[0].size`
            被完全忽略，服务端**不再发送该字段**，改为在提示词里注入「尺寸 + 方向」
            （如「输出图片尺寸为 1792x1024，横版。」）——这是该链路唯一能决定宽高比的通道。
            任何模型都不兑现绝对像素，出图面积恒定归一化到约 1,572,864 px
            （见 docs/feature-status.en.md）。
        quality: { type: string, default: auto }
        response_format: { type: string, default: b64_json, enum: [b64_json, url] }
        stream: { type: [boolean, "null"] }

    ImageEditFormRequest:
      type: object
      description: |
        `/v1/images/edits` 的 multipart/form-data 请求体。所有字段都以字符串传输：
        `n` 需可转为 1-4 的整数；`stream` 接受 "true"/"1"/"yes"/"y"/"on"（真）与
        "false"/"0"/"no"/"n"/"off"（假）。
      required: [prompt]
      properties:
        prompt: { type: string }
        model: { type: string, default: gpt-image-2 }
        n:
          type: string
          description: 字符串形式的整数，取值 1-4（服务端按 int 转换后校验）。
        size:
          type: string
          description: |
            语义同 `ImageGenerationRequest.size`：picture_v2 的接口 size 生效；
            codex 系列不发送上游 `tools[0].size`，改由提示词注入「尺寸 + 方向」。
            绝对像素不兑现（恒约 1.57M 像素）。
        quality: { type: string, default: auto }
        response_format: { type: string, default: b64_json, enum: [b64_json, url] }
        stream:
          type: string
          enum: ["true", "1", "yes", "y", "on", "false", "0", "no", "n", "off"]
          description: 字符串布尔值，语义见上方说明。
        client_task_id: { type: string }

    ImageEditJsonRequest:
      type: object
      required: [prompt]
      description: |
        JSON 载体的图片编辑请求。图片引用支持三种形式：
        http(s) URL、data URL、base64 字符串，或带 image_url/url/b64_json/base64
        字段的对象（file_id 明确不支持，返回 400）。
      properties:
        prompt: { type: string }
        model: { type: string, default: gpt-image-2 }
        n: { type: integer, minimum: 1, maximum: 4 }
        size:
          type: [string, "null"]
          description: |
            语义同 `ImageGenerationRequest.size`：picture_v2 的接口 size 生效；
            codex 系列不发送上游 `tools[0].size`，改由提示词注入「尺寸 + 方向」。
            绝对像素不兑现（恒约 1.57M 像素）。
        quality: { type: string, default: auto }
        response_format: { type: string, default: b64_json, enum: [b64_json, url] }
        stream: { type: [boolean, "null"] }
        client_task_id: { type: string }
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageReference"
        mask:
          $ref: "#/components/schemas/ImageReference"

    ImageReference:
      description: 图片引用——URL / data URL / base64 字符串，或引用对象。
      oneOf:
        - type: string
        - type: object
          additionalProperties: true
          properties:
            image_url:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: true
                  properties:
                    url: { type: string }
            url: { type: string }
            b64_json: { type: string }
            base64: { type: string }
            filename: { type: string }
            mime_type: { type: string }

    ImageGenerationChunk:
      type: object
      description: |
        `stream=true` 时 SSE 的 `data:` 行对象（**不是** OpenAI chat chunk）。
        `object` 区分三类事件；`data` 字段在 progress 阶段恒为空数组。
      required: [object, created, model, index, total, data]
      properties:
        object:
          type: string
          enum: [image.generation.chunk, image.generation.message, image.generation.result]
          description: progress / message / result 三类事件
        created: { type: integer }
        model: { type: string }
        index: { type: integer, description: 当前第几张 }
        total: { type: integer, description: 本次请求总张数 }
        data:
          type: array
          description: result 阶段为图片结果数组（元素同 ImageGenerationResponse.data）
          items: { type: object, additionalProperties: true }
        progress_text: { type: string, description: progress 阶段的上游进度文案 }
        upstream_event_type:
          type: string
          description: progress 阶段对应的上游事件类型（如 conversation.delta）
        message: { type: string, description: message 阶段的文本消息 }
        _account_email:
          type: string
          description: 本次使用的账号邮箱；服务端在 HTTP 响应中剔除该字段，仅日志使用
        _conversation_id: { type: string }

    ImageGenerationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              b64_json:
                type: [string, "null"]
                description: response_format=b64_json 时返回；同时也会给出落盘后的 url
              url:
                type: [string, "null"]
                description: 本服务落盘后的图片直链（基于 config base_url 或请求 Host 拼接）
              revised_prompt: { type: [string, "null"] }
        usage:
          type: [object, "null"]
          additionalProperties: true
          description: 由 prompt 与输出图片规格估算的 token 用量（utils/image_tokens.py）

    ImageTaskGenerationRequest:
      type: object
      required: [client_task_id, prompt]
      properties:
        client_task_id: { type: string, minLength: 1 }
        prompt: { type: string, minLength: 1 }
        model: { type: string, default: gpt-image-2 }
        size:
          type: [string, "null"]
          description: |
            语义同 `ImageGenerationRequest.size`：picture_v2 的接口 size 生效；
            codex 系列不发送上游 `tools[0].size`，改由提示词注入「尺寸 + 方向」。
            绝对像素不兑现（恒约 1.57M 像素）。
        quality: { type: string, default: auto }

    ImageTask:
      type: object
      required: [id, status, mode, model, quality, created_at, updated_at]
      properties:
        id: { type: string, description: 即提交时的 client_task_id }
        status:
          type: string
          enum: [queued, running, success, error]
        mode: { type: string, enum: [generate, edit] }
        model: { type: string }
        size: { type: string }
        quality: { type: string }
        created_at:
          type: string
          description: |
            UTC ISO8601（秒级 `Z` 后缀，如 `2026-11-01T11:12:34Z`）。
            存量任务可能仍是旧口径的本地时间 `YYYY-MM-DD HH:MM:SS`（capture：2026-11-01 实测两种并存）。
        updated_at:
          type: string
          description: 同 created_at 的时间口径
        conversation_id:
          type: [string, "null"]
          description: 上游会话 id，仅在产生后出现
        data:
          description: 生图结果（与 /v1/images/generations 的 data 同构，response_format=url）
          oneOf:
            - type: [object, "null"]
              additionalProperties: true
            - type: [array, "null"]
              items: { type: object, additionalProperties: true }
        usage: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
        progress:
          type: [string, "null"]
          description: 最近一次进度回调步骤名（如 image_stream_resolve_start）
        duration_ms: { type: [integer, "null"] }
        elapsed_secs:
          type: [number, "null"]
          description: 仅 queued/running 状态返回，运行中实时耗时（秒）

    ImageTaskList:
      type: object
      required: [items, missing_ids]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ImageTask" }
        missing_ids:
          type: array
          items: { type: string }

    ResumePollRequest:
      type: object
      properties:
        extra_timeout_secs:
          type: number
          minimum: 5
          maximum: 120
          default: 30

    EditableFileTaskRequest:
      type: object
      properties:
        prompt: { type: string, default: "" }
        base64_images:
          type: array
          items: { type: string }
          default: []
        client_task_id:
          type: [string, "null"]
          description: 为空时服务端生成

    EditableFileTask:
      type: object
      required: [id, taskId, status, kind, created_at, updated_at, elapsed_seconds]
      properties:
        id: { type: string }
        taskId: { type: string, description: 与 id 同值 }
        status:
          type: string
          enum: [queued, running, success, error]
        kind: { type: string, enum: [ppt, psd] }
        created_at:
          type: string
          description: UTC ISO8601（秒级 `Z` 后缀）；存量任务可能仍为旧口径本地时间
        updated_at: { type: string }
        elapsed_seconds: { type: integer }
        result:
          type: object
          additionalProperties: true
          description: |
            成功后出现，含 `conversation_id`、`primary_url`（主产物直链）、
            `zip_url`（打包产物直链）；直链前缀为 config base_url 或请求 Host。
            （static：services/editable_file_task_service.py:146-149）
        error: { type: [string, "null"] }

    EditableFileTaskList:
      type: object
      required: [items, missing_ids]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EditableFileTask" }
        missing_ids:
          type: array
          items: { type: string }

    UserKey:
      type: object
      required: [id, name, role, enabled, created_at]
      properties:
        id: { type: string, description: 12 位 hex }
        name: { type: string }
        role: { type: string, const: user }
        enabled: { type: boolean }
        created_at: { type: string }
        last_used_at: { type: [string, "null"] }

    Account:
      type: object
      additionalProperties: true
      description: |
        号池账号记录。字段由 account_service 决定（access_token、refresh_token、
        id_token、type、status、quota、proxy、email、last_used_at 等），本次仅静态
        读取，未逐项核实——以 /api/accounts 实际返回为准。

    ProgressStarted:
      type: object
      required: [progress_id]
      properties:
        progress_id: { type: string, format: uuid }

    CPAPool:
      type: object
      additionalProperties: true
      description: CPA 池记录；secret_key 在所有响应中被剔除。
      properties:
        name: { type: string }
        base_url: { type: string }

    Sub2APIServer:
      type: object
      additionalProperties: true
      description: Sub2API 服务器记录；password / api_key 在所有响应中被剔除。
      properties:
        name: { type: string }
        base_url: { type: string }
        has_api_key: { type: boolean }
        group_id: { type: string }

    HealthStats:
      type: object
      required: [status, healthy, version, storage, proxy_runtime, accounts]
      description: /health?format=json 返回（static：api/system/health.py:22-40；capture：2026-11-01 实测结构一致）
      properties:
        status: { type: string, enum: [ok, degraded] }
        healthy:
          type: boolean
          description: 号池 active > 0
        version: { type: string }
        storage:
          type: object
          additionalProperties: true
          properties:
            backend: { type: object, additionalProperties: true }
            health: { type: object, additionalProperties: true }
        proxy_runtime: { type: object, additionalProperties: true }
        accounts:
          type: object
          required: [total, cumulative_total, active, total_quota, limited, abnormal, disabled, total_success, total_fail, by_type]
          properties:
            total: { type: integer }
            cumulative_total: { type: integer }
            active: { type: integer }
            total_quota: { type: integer }
            limited: { type: integer }
            abnormal: { type: integer }
            disabled: { type: integer }
            total_success: { type: integer }
            total_fail: { type: integer }
            by_type:
              type: object
              additionalProperties: { type: integer }
              description: 账号类型 → 数量
