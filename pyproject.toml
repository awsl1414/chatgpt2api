[project]
name = "chatgpt2api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.15.0",
    "fastapi>=0.136.0",
    "pillow>=12.2.0",
    "pybase64>=1.4.3",
    "python-multipart>=0.0.26",
    "tiktoken>=0.12.0",
    "uvicorn>=0.44.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "gitpython>=3.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "requests>=2.32.0",
]

[tool.pytest.ini_options]
# 仅收集 test/ 包；scripts/ 下的手动验证脚本不作为 pytest 用例
testpaths = ["test"]
# 测试风格约定：新增用例统一 pytest 函数风格（def test_xxx + assert）；
# 既有 unittest.TestCase 不强制迁移，可被 pytest 正常收集运行


[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
